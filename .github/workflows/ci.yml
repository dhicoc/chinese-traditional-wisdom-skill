name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install visual deps
        working-directory: apps/visual
        run: pnpm install --no-frozen-lockfile
      - name: install mcp deps
        working-directory: apps/mcp-server
        run: pnpm install --no-frozen-lockfile
      - name: typecheck visual
        working-directory: apps/visual
        run: pnpm typecheck
      - name: typecheck mcp-server
        working-directory: apps/mcp-server
        run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install visual deps
        working-directory: apps/visual
        run: pnpm install --no-frozen-lockfile
      - name: install mcp deps
        working-directory: apps/mcp-server
        run: pnpm install --no-frozen-lockfile
      - name: vitest visual
        working-directory: apps/visual
        run: pnpm test:unit
      - name: vitest mcp-server
        working-directory: apps/mcp-server
        run: pnpm test
      - name: smoke + contracts visual
        working-directory: apps/visual
        run: |
          node scripts/smoke-react-shell.mjs
          node scripts/check-doc-contracts.mjs
          node scripts/check-knowledge-references.mjs
          node scripts/check-mapping-schema.mjs
          node scripts/check-react-migration.mjs
          node scripts/check-search-index.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install visual deps
        working-directory: apps/visual
        run: pnpm install --no-frozen-lockfile
      - name: build visual
        working-directory: apps/visual
        run: pnpm build
