name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  visual:
    name: Visual quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/visual
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/visual/pnpm-lock.yaml
      - name: install visual deps
        run: pnpm install --no-frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: unit tests
        run: pnpm test:unit
      - name: contracts and smoke checks
        run: |
          node scripts/smoke-react-shell.mjs
          node scripts/check-doc-contracts.mjs
          node scripts/check-knowledge-references.mjs
          node scripts/check-mapping-schema.mjs
          node scripts/check-react-migration.mjs
          node scripts/check-search-index.mjs
      - name: build
        run: pnpm build
